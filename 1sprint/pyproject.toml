[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptocore"
version = "0.1.0"
description = "A command-line tool for block cipher operations."
requires-python = ">=3.8"
dependencies = [
    "pycryptodome>=3.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
cryptocore = "cryptocore.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
